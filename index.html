    <title>BrainiLens</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #FBF8F1;
        font-family: Inter, system-ui, -apple-system, sans-serif;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #FBF8F1;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #boot-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot-splash .mark {
        width: 88px;
        height: 88px;
        object-fit: contain;
      }
      #boot-splash .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.4rem;
        text-align: center;
        padding: 0 1.5rem;
      }
      #boot-splash .wordmark {
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.1;
        text-transform: lowercase;
      }
      #boot-splash .wordmark .b { color: #DC9F42; }
      #boot-splash .wordmark .rest { color: #14274E; }
      #boot-splash .tagline {
        margin: 0;
        font-size: 0.9rem;
        font-weight: 500;
        color: #5c6578;
        letter-spacing: 0.02em;
      }
      #boot-splash .pulse {
        width: 28px;
        height: 28px;
        margin-top: 0.75rem;
        border: 3px solid rgba(20, 39, 78, 0.15);
        border-top-color: #14274E;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "brainilens",
        "description": "BrainiLens helps parents track their child's learning, assignments, progress and academic growth with AI-powered insights.",
        "url": "https://brainilens.vercel.app/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web"
      }
    </script>

  <body>
    <div id="boot-splash" aria-hidden="true">
      <img class="mark" src="/brand/logo-icon.svg?v=embrace3" alt="" width="88" height="88" />
      <div class="brand">
        <div class="wordmark">
          <span class="b">b</span><span class="rest">rainilens</span>
        </div>
        <p class="tagline">Learn · Explore · Grow</p>
      </div>
      <div class="pulse" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
